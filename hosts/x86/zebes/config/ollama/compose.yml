version: '3.8'
name: ollama
services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    restart: unless-stopped
    
    # AMD GPU support
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    
    group_add:
      - video
      - render
    
    environment:
      # AMD GPU configuration
      HSA_OVERRIDE_GFX_VERSION: "11.0.0"  # For RX 7000 series
      # HSA_OVERRIDE_GFX_VERSION: "10.3.0"  # For RX 6000 series
      
      # Ollama configuration
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_ORIGINS: "*"
      OLLAMA_MODELS: "/models"
      OLLAMA_KEEP_ALIVE: "5m"
      
      # Performance settings
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_FLASH_ATTENTION: "true"
      
      # ROCm optimizations
      PYTORCH_HIP_ALLOC_CONF: "expandable_segments:True"
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      PYTORCH_TUNABLEOP_ENABLED: "1"
    
    volumes:
      # Model storage
      - /store/ollama/models:/models
      - /store/ollama/config:/root/.ollama
    
    ports:
      - "11434:11434"
    
    # Performance settings
    ipc: host
    shm_size: '16gb'
    
    # Security
    security_opt:
      - seccomp:unconfined
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 32G
        reservations:
          devices:
            - driver: amdgpu
              count: 1
              capabilities: [gpu]
    
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    
    ports:
      - "3000:8080"
    
    volumes:
      # Persistent data storage
      - /store/open-webui:/app/backend/data
      
      # Share models directory (read-only)
      - /store/ollama/models:/app/backend/models:ro
    
    environment:
      # Connect to Ollama container
      OLLAMA_BASE_URL: "http://ollama:11434"
      
      # Security key (generate with: openssl rand -hex 32)
      WEBUI_SECRET_KEY: ""  # TODO: Add your secret key
      
      # Authentication settings
      ENABLE_SIGNUP: "false"
      DEFAULT_USER_ROLE: "user"
      
      # Model settings
      DEFAULT_MODELS: "llama3.2,mistral,codellama,qwen2.5-coder"
      MODEL_FILTER_ENABLED: "false"
      
      # Features
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_RAG_WEB_SEARCH: "true"
      RAG_EMBEDDING_MODEL: "nomic-embed-text:latest"
      
      # Image generation integration (optional - connect to ComfyUI)
      # AUTOMATIC1111_BASE_URL: "http://comfy:8188"
      # ENABLE_IMAGE_GENERATION: "true"
      
      # Disable telemetry
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Use shared AI network
networks:
  default:
    name: ai-network
    external: false

# Volumes configuration
volumes:
  ollama-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /store/ollama/models
  
  ollama-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /store/ollama/config
  
  open-webui:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /store/open-webui