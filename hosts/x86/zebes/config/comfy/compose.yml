version: "3.8"
name: comfy
services:
    comfy:
        image: corundex/comfyui-rocm:latest
        container_name: comfy
        restart: unless-stopped

        # AMD GPU device access
        devices:
            - /dev/kfd:/dev/kfd
            - /dev/dri:/dev/dri

        # Required for GPU access
        group_add:
            - video
            - render

        # Network configuration
        ports:
            - "8188:8188"

        # Environment variables
        environment:
            # Model download behavior:
            # - 'default': Downloads essential models only
            # - 'all': Downloads all available models
            # - 'none': No automatic downloads
            MODEL_DOWNLOAD: none

            # GPU selection (use 0 for first GPU, or comma-separated for multiple)
            HIP_VISIBLE_DEVICES: 0

            # Disable CUDA (we're using ROCm)
            CUDA_VISIBLE_DEVICES: ""

            # Performance tuning for AMD GPUs
            PYTORCH_HIP_ALLOC_CONF: expandable_segments:True
            HSA_OVERRIDE_GFX_VERSION: 11.0.0 # For RX 7000 series

            # Additional ROCm optimizations
            TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: 1
            PYTORCH_TUNABLEOP_ENABLED: 1

        # Volume mounts for persistent data
        volumes:
            # Model storage (checkpoints, LoRAs, VAEs, etc.)
            - /store/ai-models:/workspace/ComfyUI/models:rw

            # Generated images output
            - /store/ai-outputs:/workspace/ComfyUI/output:rw

            # Input images for img2img, etc.
            - /store/ai-inputs:/workspace/ComfyUI/input:rw

            # Custom nodes and extensions
            - /store/comfyui/custom_nodes:/workspace/ComfyUI/custom_nodes:rw

            # User settings and workflows
            - /store/comfyui/user:/workspace/ComfyUI/user:rw

            # ComfyUI Manager (if you want to use it)
            - /store/comfyui/ComfyUI-Manager:/workspace/ComfyUI/custom_nodes/ComfyUI-Manager:rw

            # Cache for faster loading
            - /store/comfyui/cache:/root/.cache:rw

        # Shared memory size (important for PyTorch)
        shm_size: "8gb"

        # IPC mode for better GPU memory management
        ipc: host

        # Security options
        security_opt:
            - seccomp:unconfined # Required for some GPU operations

        # Resource limits (optional, adjust based on your system)
        deploy:
            resources:
                limits:
                    memory: 32G # Adjust based on your RAM
                reservations:
                    devices:
                        - driver: amdgpu
                          count: 1
                          capabilities: [gpu]

# Use shared AI network for all AI services
networks:
    default:
        name: ai-network
        external: false
