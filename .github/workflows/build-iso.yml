name: Build NixOS ISOs (x86 only)

on:
  push:
    branches: [main]
    tags: ["*"]
    paths:
      - "dist/**"
      - "modules/hosts/**"
      - "modules/home/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

jobs:
  build-iso:
    strategy:
      matrix:
        iso-type: [server, desktop]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build ISO
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            nix build ./dist#${{ matrix.iso-type }}-iso-x86 \
              --out-link result-${{ matrix.iso-type }} \
              --print-build-logs \
              --accept-flake-config

      - name: Locate ISO
        id: iso-info
        run: |
          ISO_FILE=$(find -L "result-${{ matrix.iso-type }}" -type f \( -name "*.iso" -o -name "*.iso.zst" \) -print -quit)
          test -n "$ISO_FILE"
          ISO_FILE=$(readlink -f "$ISO_FILE")
          echo "iso-path=$ISO_FILE" >> "$GITHUB_OUTPUT"
          echo "iso-name=$(basename "$ISO_FILE")" >> "$GITHUB_OUTPUT"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-${{ matrix.iso-type }}-x86-iso
          path: ${{ steps.iso-info.outputs.iso-path }}
          retention-days: 30
          if-no-files-found: error

  create-release:
    needs: build-iso
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download ISO artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./isos

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ./isos/**/*.iso*
          tag_name: ${{ github.ref_name }}
          name: NixOS ISOs ${{ github.ref_name }}
          body: |
            ## NixOS ISOs for ${{ github.ref_name }}

            This release contains automatically built NixOS installation media based on the current dot.nix modules.

            ### Available ISOs
            - **Server ISO**: Minimal server environment with SSH access
            - **Desktop ISO**: Current dot.nix desktop with graphical installer
            - **Architecture**: x86_64 (Intel/AMD systems)

            ### Usage
            1. Download the appropriate ISO.
            2. Flash it to USB or boot it in a VM.
            3. Log in as `nixos` with password `nixos`.

            ARM outputs remain available for local builds.

            Built automatically from commit: ${{ github.sha }}
